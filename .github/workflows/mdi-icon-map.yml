name: MDI icon map

on:
  pull_request:
    paths:
      - "CnGalWebSite/CnGalWebSite.MainSite.Shared/**/*.razor"
      - "CnGalWebSite/CnGalWebSite.MainSite.Shared/**/*.cs"
      - "CnGalWebSite/CnGalWebSite.MainSite/**/*.razor"
      - "CnGalWebSite/CnGalWebSite.MainSite/**/*.cs"
      - "mdi_extract.py"
      - ".github/workflows/mdi-icon-map.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mdi-icon-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Generate MDI icon map
        run: uv run mdi_extract.py

      - name: Check MDI icon map
        run: git diff --exit-code -- CnGalWebSite/CnGalWebSite.MainSite.Shared/Components/DesignSystem/CgMdiIconMap.g.cs
