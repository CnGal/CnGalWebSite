name: Build and push Mcp

on:
  workflow_dispatch: # 手动触发

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cngalwebsite-mcp

concurrency:
  group: build-push-mcp

jobs:
  build-and-push:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Mcp
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./CnGalWebSite/CnGalWebSite.Mcp/Dockerfile
          push: true
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
