# Requires Docker Compose 5.4.0+ for pre_start hook image resolution.
services:
  apiserver:
    image: ghcr.io/cngal/cngalwebsite-apiserver:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-apiserver}
    hostname: apiserver

    restart: unless-stopped

    pre_start:
      - image: busybox
        command: ["chown", "-R", "1654:1654", "/home/app/.aspnet/DataProtection-Keys"]
        user: root

    ports:
      - ${HTTP_PORT:-2001}:8080
      # - ${HTTPS_PORT:-3001}:8081

    environment:
      # 运行环境
      TZ: ${TZ:-Asia/Shanghai}

      # 数据库与认证
      ConnectionStrings__Default: ${ConnectionStrings__Default:-}
      JwtBearer__Authority: ${JwtBearer__Authority:-https://oauth2.cngal.org}
      InternalApiAccess__ProjectSiteToken: ${InternalApiAccess__ProjectSiteToken:-}
      Geetest__Id: ${Geetest__Id:-}
      Geetest__Key: ${Geetest__Key:-}
      ClientIp__TrustedProxyHosts: ${ClientIp__TrustedProxyHosts:-}

      # 邮件服务
      Mail__Server: ${Mail__Server:-smtp.exmail.qq.com}
      Mail__Port: ${Mail__Port:-465}
      Mail__SenderName: ${Mail__SenderName:-CnGal资料站}
      Mail__SenderEmail: ${Mail__SenderEmail:-kanban@cngal.org}
      Mail__Account: ${Mail__Account-kanban@cngal.org}
      Mail__Password: ${Mail__Password:-}

      # 搜索服务
      Meilisearch__BaseAddress: ${Meilisearch__BaseAddress:-}
      Meilisearch__ApiKey: ${Meilisearch__ApiKey:-}

      # 图床与外部接口
      ImageApi__BaseAddress: ${ImageApi__BaseAddress:-https://api.cngal.top/}
      BackupArchive__BaseAddress: ${BackupArchive__BaseAddress:-http://web.archive.org/save/}
      Steam__BaseAddress: ${Steam__BaseAddress:-https://api.steampowered.com/}
      Steam__ApiToken: ${Steam__ApiToken:-}
      IsThereAnyDeal__ApiToken: ${IsThereAnyDeal__ApiToken:-}
      HeyBox__GameDetailBaseAddress: ${HeyBox__GameDetailBaseAddress:-}
      Gamalytic__BaseAddress: ${Gamalytic__BaseAddress:-}
      VgInsights__BaseAddress: ${VgInsights__BaseAddress:-}

      # 内容采集
      Rss__BaseAddress: ${Rss__BaseAddress:-https://rss.cngal.top/}
      Rss__BilibiliFeedAddress: ${Rss__BilibiliFeedAddress:-}
      Rss__HeyBoxFeedAddress: ${Rss__HeyBoxFeedAddress:-}
      Bilibili__Cookie: ${Bilibili__Cookie:-}
      AutomationUsers__NewsAdminId: ${AutomationUsers__NewsAdminId:-30e74a97-12f9-420e-8f90-03aab796fa05}
      AutomationUsers__ExamineAdminId: ${AutomationUsers__ExamineAdminId:-a27c27d9-8c42-49f4-a315-05a167e1a6d4}

      # GPT 请求限制
      ChatGpt__BaseAddress: ${ChatGpt__BaseAddress:-}
      ChatGpt__ApiKey: ${ChatGpt__ApiKey:-}
      ChatGpt__GlobalRequestsPerMinute: ${ChatGpt__GlobalRequestsPerMinute:-10}
      ChatGpt__UserRequestsPerMinute: ${ChatGpt__UserRequestsPerMinute:-10}
      ChatGpt__UserRequestsPerDay: ${ChatGpt__UserRequestsPerDay:-1000}
      ChatGpt__MaxMessagesPerConversation: ${ChatGpt__MaxMessagesPerConversation:-5}
      ChatGpt__SystemMessageTemplate: ${ChatGpt__SystemMessageTemplate:-}
      ChatGpt__UserMessageTemplate: ${ChatGpt__UserMessageTemplate:-}

      # 事件总线
      RabbitMq__HostName: ${RabbitMq__HostName:-}
      RabbitMq__Port: ${RabbitMq__Port:-5672}
      RabbitMq__UserName: ${RabbitMq__UserName:-}
      RabbitMq__Password: ${RabbitMq__Password:-}

    labels:
      com.centurylinklabs.watchtower.enable: ${WATCHTOWER_ENABLE:-true}

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/healthz"]

    volumes:
      - ${DATA_PROTECTION_KEYS_DIR:-apiserver-DataProtection-Keys}:/home/app/.aspnet/DataProtection-Keys

    deploy:
      resources:
        limits:
          memory: ${RESOURCES_LIMITS_MEMORY:-2G}

volumes:
  apiserver-DataProtection-Keys:
