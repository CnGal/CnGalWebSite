# Requires Docker Compose 5.4.0+ for pre_start hook image resolution.
services:
  drawingbed:
    image: ghcr.io/cngal/cngalwebsite-drawingbed:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-drawingbed}
    hostname: drawingbed

    restart: unless-stopped

    pre_start:
      - image: busybox
        command: ["chown", "-R", "1654:1654", "/home/app/.aspnet/DataProtection-Keys", "/app/wwwroot"]
        user: root

    ports:
      - ${PORT:-2003}:8080

    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Asia/Shanghai}

      # 上传和转存共用的处理并发数与等待队列容量
      UploadRateLimit__PermitLimit: ${UploadRateLimit__PermitLimit:-4}
      UploadRateLimit__QueueLimit: ${UploadRateLimit__QueueLimit:-128}

      # JWT 鉴权地址
      JwtBearer__Authority: ${JwtBearer__Authority:-https://oauth2.cngal.org}

      # 阿里云 OSS 服务地址（必填）
      AliyunOss__Endpoint: ${AliyunOss__Endpoint:?AliyunOss__Endpoint is required}
      # 阿里云 OSS 存储桶名称（必填）
      AliyunOss__BucketName: ${AliyunOss__BucketName:?AliyunOss__BucketName is required}
      # 阿里云 OSS 访问密钥 ID
      AliyunOss__AccessKeyId: ${AliyunOss__AccessKeyId:-}
      # 阿里云 OSS 访问密钥
      AliyunOss__AccessKeySecret: ${AliyunOss__AccessKeySecret:-}

      # 数据库连接字符串
      ConnectionStrings__Default: ${ConnectionStrings__Default:-}

      # 腾讯云 COS 地域
      TencentCos__Region: ${TencentCos__Region:-}
      # 腾讯云 COS 访问密钥 ID
      TencentCos__SecretId: ${TencentCos__SecretId:-}
      # 腾讯云 COS 访问密钥
      TencentCos__SecretKey: ${TencentCos__SecretKey:-}
      # 腾讯云 COS 存储桶名称（必填）
      TencentCos__BucketName: ${TencentCos__BucketName:?TencentCos__BucketName is required}

      # 图仓 API 令牌
      TucangCc__ApiToken: ${TucangCc__ApiToken:-}
      # 图仓上传接口地址
      TucangCc__UploadUrl: ${TucangCc__UploadUrl:-https://tucang.cc/api/v1/upload}
      # 图仓公开访问地址前缀
      TucangCc__PublicBaseAddress: ${TucangCc__PublicBaseAddress:-https://tucang.cngal.top/api/image/show/}

      # 阿里云 OSS 音频公开访问地址前缀
      AliyunOss__PublicBaseAddress: ${AliyunOss__PublicBaseAddress:-https://res.cngal.org/}
      # 腾讯云 COS 图片公开访问地址前缀
      TencentCos__PublicBaseAddress: ${TencentCos__PublicBaseAddress:-https://image.cngal.org/}

    labels:
      com.centurylinklabs.watchtower.enable: ${WATCHTOWER_ENABLE:-true}

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/healthz"]

    volumes:
      - ${DATA_PROTECTION_KEYS_DIR:-drawingbed-DataProtection-Keys}:/home/app/.aspnet/DataProtection-Keys
      - ${WWWROOT_DIR:-drawingbed-wwwroot}:/app/wwwroot

    deploy:
      resources:
        limits:
          memory: ${RESOURCES_LIMITS_MEMORY:-2g}

volumes:
  drawingbed-DataProtection-Keys:
  drawingbed-wwwroot:
