# Requires Docker Compose 5.4.0+ for pre_start hook image resolution.
services:
  mainsite:
    image: ghcr.io/cngal/cngalwebsite-mainsite:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-mainsite}
    hostname: mainsite

    restart: unless-stopped

    pre_start:
      - image: busybox
        command: ["chown", "-R", "1654:1654", "/home/app/.aspnet/DataProtection-Keys"]
        user: root

    ports:
      - ${PORT:-2010}:8080
      # - ${HTTPS_PORT:-3010}:8081

    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Asia/Shanghai}

      # 后端API
      MainSiteApi__BaseAddress: ${WebApiPath:-https://api.cngal.org/}
      # 图床API
      ImageApi__BaseAddress: ${ImageApi__BaseAddress:-https://api.cngal.top/}
      # 定时任务API
      MainSiteApi__TaskApiPath: ${TaskApiPath}

      # OIDC 鉴权
      Oidc__Authority: ${Authority:-https://oauth2.cngal.org}
      Oidc__ClientId: ${ClientId}
      Oidc__ClientSecret: ${ClientSecret}
      Oidc__RequireHttpsMetadata: ${RequireHttpsMetadata:-true}

    labels:
      com.centurylinklabs.watchtower.enable: ${WATCHTOWER_ENABLE:-true}

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/healthz"]

    volumes:
      - ${DATA_PROTECTION_KEYS_DIR:-mainsite-DataProtection-Keys}:/home/app/.aspnet/DataProtection-Keys

    deploy:
      resources:
        limits:
          memory: ${RESOURCES_LIMITS_MEMORY:-1.5G}

volumes:
  mainsite-DataProtection-Keys:
