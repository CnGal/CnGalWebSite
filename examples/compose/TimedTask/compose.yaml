# Requires Docker Compose 5.4.0+ for pre_start hook image resolution.
services:
  timedtask:
    image: ghcr.io/cngal/cngalwebsite-timedtask:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-timedtask}
    hostname: timedtask

    restart: unless-stopped

    pre_start:
      - image: busybox
        command: ["chown", "-R", "1654:1654", "/home/app/.aspnet/DataProtection-Keys"]
        user: root

    ports:
      - ${PORT:-2009}:8080
      # - ${HTTPS_PORT:-3009}:8081

    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # Ids 地址
      Authority: ${Authority:-https://oauth2.cngal.org}
      # 数据库连接字符串
      DefaultDBConnection: ${DefaultDBConnection}
      # 事件总线
      RabbitMq__HostName: ${RabbitMq__HostName:-}
      RabbitMq__Port: ${RabbitMq__Port:-5672}
      RabbitMq__UserName: ${RabbitMq__UserName:-}
      RabbitMq__Password: ${RabbitMq__Password:-}

    labels:
      com.centurylinklabs.watchtower.enable: ${WATCHTOWER_ENABLE:-true}

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/healthz"]

    volumes:
      - ${DATA_PROTECTION_KEYS_DIR:-DataProtection-Keys}:/home/app/.aspnet/DataProtection-Keys

    deploy:
      resources:
        limits:
          memory: ${RESOURCES_LIMITS_MEMORY:-100m}

volumes:
  DataProtection-Keys:
