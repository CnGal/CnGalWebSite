# Requires Docker Compose 5.4.0+ for pre_start hook image resolution.
services:
  expo:
    image: ghcr.io/cngal/cngalwebsite-expo:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-expo}
    hostname: expo

    restart: unless-stopped

    pre_start:
      - image: busybox
        command: ["chown", "-R", "1654:1654", "/home/app/.aspnet/DataProtection-Keys"]
        user: root

    ports:
      - ${PORT:-2202}:8080
      # - ${HTTPS_PORT:-3302}:8081

    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WebApiPath: ${WebApiPath:-https://api.cngal.org/}
      Authority: ${Authority:-https://oauth2.cngal.org}
      ClientId: ${ClientId}
      ClientSecret: ${ClientSecret}
      # 图床API
      ImageApi__BaseAddress: ${ImageApi__BaseAddress:-https://api.cngal.top/}

    labels:
      com.centurylinklabs.watchtower.enable: ${WATCHTOWER_ENABLE:-true}

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/healthz"]

    volumes:
      - ${DATA_PROTECTION_KEYS_DIR:-expo-DataProtection-Keys}:/home/app/.aspnet/DataProtection-Keys

    deploy:
      resources:
        limits:
          memory: ${RESOURCES_LIMITS_MEMORY:-1.5G}

volumes:
  expo-DataProtection-Keys:
